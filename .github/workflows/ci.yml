name: CI — Perf Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Lint & Unit Tests ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Validate flight schema generation
        run: |
          python -c "
          from data.flight_schema import generate_flight_event, generate_batch
          import json

          event = generate_flight_event()
          assert 'event_id' in event
          assert 'flight' in event
          assert 'event_type' in event
          assert event['schema_version'] == '1.0'

          batch = generate_batch(10)
          assert len(batch) == 10

          print('✅ Schema validation passed')
          print(json.dumps(event, indent=2))
          "

      - name: Validate JMX generation
        run: |
          python jmeter/generate_jmx.py --threads 10 --ramp-up 5 --duration 30
          test -f jmeter/flight_ops_perf_test.jmx && echo "✅ JMX file generated"

  # ── Kafka + Locust Smoke Test ──────────────────────────────────
  kafka-smoke-test:
    name: Kafka Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Kafka to be ready
        run: |
          pip install kafka-python
          python -c "
          import time
          from kafka import KafkaAdminClient
          from kafka.admin import NewTopic
          for i in range(30):
              try:
                  admin = KafkaAdminClient(bootstrap_servers='localhost:9092')
                  admin.create_topics([NewTopic('flight-operations', 3, 1)])
                  print('✅ Kafka ready')
                  break
              except Exception as e:
                  print(f'Waiting... ({i+1}/30): {e}')
                  time.sleep(3)
          "

      - name: Run Kafka producer smoke test
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_TOPIC: flight-operations
        run: |
          python kafka/producer_perf_test.py --messages 50 --test throughput

      - name: Run Locust headless smoke test (30s)
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_TOPIC: flight-operations
        run: |
          locust -f locust/locustfile.py \
            --headless \
            --users 5 \
            --spawn-rate 1 \
            --run-time 30s \
            --only-summary \
            --host http://localhost \
            --locustfile locust/locustfile.py \
            FlightOpsProducerUser 2>&1 | tail -20

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: results/
